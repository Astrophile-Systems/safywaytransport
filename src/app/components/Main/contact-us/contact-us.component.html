<section class="py-24">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="grid lg:grid-cols-2 grid-cols-1">
      <div class="lg:mb-0 mb-10">
        <div class="group w-full h-full">
          <div class="relative h-full">
            <img src="contactus.jpeg" alt="ContactUs tailwind section"
              class="w-full h-full lg:rounded-l-2xl rounded-2xl bg-blend-multiply bg-[#F6BE55] object-cover" />
            <h1 class="font-manrope text-white text-4xl font-bold leading-10 absolute top-11 left-11">
              Contact us
            </h1>
            <div class="absolute bottom-0 w-full lg:p-11 p-5">
              <div class="bg-white rounded-lg p-6 block">
                <a href="javascript:;" class="flex items-center mb-6">
                  <svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path

                      stroke="#F6BE55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                  <h5 class="text-black text-base font-normal leading-6 ml-5">
                    +966598893950
                  </h5>
                </a>
                <a href="javascript:;" class="flex items-center mb-6">
                  <svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                      d="M2.81501 8.75L10.1985 13.6191C12.8358 15.2015 14.1544 15.9927 15.6032 15.9582C17.0519 15.9237 18.3315 15.0707 20.8905 13.3647L27.185 8.75M12.5 25H17.5C22.214 25 24.5711 25 26.0355 23.5355C27.5 22.0711 27.5 19.714 27.5 15C27.5 10.286 27.5 7.92893 26.0355 6.46447C24.5711 5 22.214 5 17.5 5H12.5C7.78595 5 5.42893 5 3.96447 6.46447C2.5 7.92893 2.5 10.286 2.5 15C2.5 19.714 2.5 22.0711 3.96447 23.5355C5.42893 25 7.78595 25 12.5 25Z"
                      stroke="#F6BE55" stroke-width="2" stroke-linecap="round" />
                  </svg>
                  <h5 class="text-black text-base font-normal leading-6 ml-5">
                    safewaytransport4&#64;gmail.com
                  </h5>
                </a>
                <a href="javascript:;" class="flex items-center">
                  <svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                      d="M25 12.9169C25 17.716 21.1939 21.5832 18.2779 24.9828C16.8385 26.6609 16.1188 27.5 15 27.5C13.8812 27.5 13.1615 26.6609 11.7221 24.9828C8.80612 21.5832 5 17.716 5 12.9169C5 10.1542 6.05357 7.5046 7.92893 5.55105C9.8043 3.59749 12.3478 2.5 15 2.5C17.6522 2.5 20.1957 3.59749 22.0711 5.55105C23.9464 7.5046 25 10.1542 25 12.9169Z"
                      stroke="#F6BE55" stroke-width="2" />
                    <path
                      d="M17.5 11.6148C17.5 13.0531 16.3807 14.219 15 14.219C13.6193 14.219 12.5 13.0531 12.5 11.6148C12.5 10.1765 13.6193 9.01058 15 9.01058C16.3807 9.01058 17.5 10.1765 17.5 11.6148Z"
                      stroke="#F6BE55" stroke-width="2" />
                  </svg>
                  <h5 class="text-black text-base font-normal leading-6 ml-5">
                    Jeddah and Riyadh
                  </h5>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="bg-gray-50 p-5 lg:p-11 lg:rounded-r-2xl rounded-2xl">
        <h2 class="text-[#F6BE55] font-manrope text-4xl font-semibold leading-10 mb-11">
          Book Your Ride
        </h2>
        <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="space-y-5">
          <!-- Full Name -->
          <div class="mb-5">
            <label for="fullName" class="block text-sm font-medium text-gray-700 mb-2">
              Full Name
            </label>
            <input type="text" id="fullName" formControlName="fullName"
              class="w-full px-4 py-3 border border-gray-300 rounded-md text-gray-900 placeholder-gray-400 focus:outline-none focus:border-[#F6BE55] focus:ring-2 focus:ring-[#F6BE55]/20 transition-all duration-200 hover:border-gray-400"
              placeholder="Enter your full name" />
          </div>

          <!-- Phone Number -->
          <div class="mb-5">
            <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">
              Phone Number
            </label>
            <div class="phone-input-container">
              <ngx-intl-tel-input [cssClass]="''" [preferredCountries]="preferredCountries"
                [enableAutoCountrySelect]="true" [enablePlaceholder]="true" [searchCountryFlag]="true"
                [searchCountryField]="[
                  SearchCountryField.Name,
                  SearchCountryField.DialCode,
                  SearchCountryField.Iso2
                ]" [selectFirstCountry]="false" [selectedCountryISO]="CountryISO.SaudiArabia" [phoneValidation]="true"
                [separateDialCode]="true" formControlName="phoneNumber" name="phone"
                fieldId="phone"></ngx-intl-tel-input>
            </div>
          </div>

          <!-- Date and Time Row -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">
            <div>
              <label for="pickupDate" class="block text-sm font-medium text-gray-700 mb-2">
                Pick Up Date
              </label>
              <input type="date" id="pickupDate" formControlName="pickupDate"
                class="w-full px-4 py-3 border border-gray-300 rounded-md text-gray-900 focus:outline-none focus:border-[#F6BE55] focus:ring-2 focus:ring-[#F6BE55]/20 transition-all duration-200 hover:border-gray-400" />
            </div>
            <div>
              <label for="pickupTime" class="block text-sm font-medium text-gray-700 mb-2">
                Pick Up Time
              </label>
              <input type="time" id="pickupTime" formControlName="pickupTime"
                class="w-full px-4 py-3 border border-gray-300 rounded-md text-gray-900 focus:outline-none focus:border-[#F6BE55] focus:ring-2 focus:ring-[#F6BE55]/20 transition-all duration-200 hover:border-gray-400" />
            </div>
          </div>

          <!-- Passengers -->
          <div class="mb-5">
            <label for="passengers" class="block text-sm font-medium text-gray-700 mb-2">
              Number of Passengers
            </label>
            <input type="number" id="passengers" formControlName="passengers" min="1" max="50"
              class="w-full px-4 py-3 border border-gray-300 rounded-md text-gray-900 placeholder-gray-400 focus:outline-none focus:border-[#F6BE55] focus:ring-2 focus:ring-[#F6BE55]/20 transition-all duration-200 hover:border-gray-400"
              placeholder="Enter number of passengers" />
          </div>

          <!-- Pickup and Destination Row -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">
            <div>
              <label for="pickupLocation" class="block text-sm font-medium text-gray-700 mb-2">
                Pick Up Location
              </label>
              <app-custom-dropdown [options]="pickupLocationOptions" placeholder="Select pickup location"
                formControlName="pickupLocation"></app-custom-dropdown>
            </div>
            <div>
              <label for="destinationLocation" class="block text-sm font-medium text-gray-700 mb-2">
                Destination Location
              </label>
              <app-custom-dropdown [options]="destinationLocationOptions" placeholder="Select destination"
                formControlName="destinationLocation"></app-custom-dropdown>
            </div>
          </div>

          <!-- Vehicle Selection -->
          <div class="mb-6">
            <label for="vehicle" class="block text-sm font-medium text-gray-700 mb-2">
              Select Vehicle
            </label>
            <app-custom-dropdown [options]="vehicleOptions" placeholder="Choose your vehicle"
              formControlName="vehicle"></app-custom-dropdown>
          </div>

          <!-- Submit Button -->
          <div class="pt-2">
            <button type="submit"
              class="w-full bg-gradient-to-r from-[#F6BE55] to-[#E6A43B] hover:from-[#E6A43B] hover:to-[#D69E2E] text-white font-semibold py-3 px-6 rounded-md transition-all duration-300 transform hover:-translate-y-0.5 hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-[#F6BE55]/50 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none disabled:shadow-none"
              [disabled]="!contactForm.valid">
              <span class="flex items-center justify-center">
                <svg class="w-5 h-5 mr-2 transition-transform duration-200 group-hover:translate-x-1" fill="none"
                  stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                </svg>
                Book Your Ride
              </span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
