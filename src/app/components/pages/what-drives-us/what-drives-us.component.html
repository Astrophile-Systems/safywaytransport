<section class="py-20 bg-white dark:bg-gray-900">
  <div class="container mx-auto px-4">
    <!-- Header Section -->
    <div class="text-center mb-20">
      <h2 class="text-4xl lg:text-5xl font-bold text-gray-800 dark:text-white mb-8">
        What Drives 
        <span class="text-amber-500 dark:text-amber-400">Us</span>
      </h2>
    </div>

    <!-- Mission and Vision Cards -->
    <div class="grid lg:grid-cols-2 gap-8 max-w-6xl mx-auto">
      <!-- Mission Card -->
      <div class="relative bg-gray-50 dark:bg-gray-800 rounded-2xl p-8 lg:p-12 border border-gray-200 dark:border-gray-700 hover:shadow-lg transition-all duration-300">
        <!-- Decorative Line -->
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-amber-300 to-amber-500 rounded-t-2xl"></div>
        
        <div class="space-y-6">
          <h3 class="text-2xl lg:text-3xl font-bold text-amber-500 dark:text-amber-400">
            {{ mission.title }}
          </h3>
          <p class="text-lg text-gray-700 dark:text-gray-300 leading-relaxed">
            {{ mission.description }}
          </p>
        </div>

        <!-- Background Pattern -->
        <div class="absolute bottom-0 right-0 w-32 h-32 opacity-5 dark:opacity-10">
          <svg viewBox="0 0 24 24" fill="currentColor" class="w-full h-full text-amber-500">
            <path d="M12 2L13.09 8.26L20 9L13.09 9.74L12 16L10.91 9.74L4 9L10.91 8.26L12 2Z"/>
          </svg>
        </div>
      </div>

      <!-- Vision Card -->
      <div class="relative bg-amber-400 dark:bg-amber-500 rounded-2xl p-8 lg:p-12 text-white hover:shadow-lg transition-all duration-300 transform hover:-translate-y-1">
        <div class="space-y-6">
          <h3 class="text-2xl lg:text-3xl font-bold text-gray-900 dark:text-white">
            {{ vision.title }}
          </h3>
          <p class="text-lg text-gray-900 dark:text-white leading-relaxed">
            {{ vision.description }}
          </p>
        </div>

        <!-- Background Pattern -->
        <div class="absolute bottom-0 right-0 w-32 h-32 opacity-10">
          <svg viewBox="0 0 24 24" fill="currentColor" class="w-full h-full text-gray-900">
            <path d="M12 2L13.09 8.26L20 9L13.09 9.74L12 16L10.91 9.74L4 9L10.91 8.26L12 2Z"/>
          </svg>
        </div>

        <!-- Decorative Elements -->
        <div class="absolute -top-2 -right-2 w-6 h-6 bg-white dark:bg-gray-100 rounded-full opacity-20"></div>
        <div class="absolute -bottom-2 -left-2 w-4 h-4 bg-white dark:bg-gray-100 rounded-full opacity-30"></div>
      </div>
    </div>

    <!-- Bottom Decorative Element -->
    <div class="flex justify-center mt-16">
      <div class="w-24 h-1 bg-gradient-to-r from-transparent via-amber-400 to-transparent rounded-full"></div>
    </div>
  </div>
</section>
