<header class="bg-white shadow-md sticky top-0 z-50">
  <!-- Yellow top contact bar with diagonal cut -->
  <div class="flex m-0 relative overflow-hidden">
    <div
      class="hidden md:block relative topbar-content-1 top-0 w-[25%] h-full bg-white transform skew-x-12 translate-x-16">
    </div>
    <div class="relative bg-[#FFD87D] w-full md:w-[75%] py-3 px-10 overflow-hidden topbar-content">
      <!-- Diagonal cut shape -->

      <div class="container mx-auto px-4 relative z-10">
        <div class="flex justify-between items-center text-sm text-black">
          <div class="flex items-center space-x-8">
            <div class="flex items-center space-x-2">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z">
                </path>
              </svg>
              <span class="font-medium">+966 55 123 4567</span>
            </div>
            <div class="flex items-center space-x-2">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 8l7.89 4.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                </path>
              </svg>
              <span class="font-medium">support&#64;umrahtransport.com</span>
            </div>
          </div>
          <div class="hidden lg:block pr-20">
            <span class="font-medium">Available 24/7 during Hajj & Umrah seasons</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- White main navigation -->
  <nav class="bg-white">
    <div class="container mx-auto px-4">
      <div class="flex justify-between items-center">
        <!-- Logo section -->
        <div class="flex items-center space-x-3 -mt-15">
          <!-- <div class="relative">
            <div class="h-16 w-16 bg-yellow-400 rounded-full flex items-center justify-center relative overflow-hidden">
              <div class="absolute top-1 left-1 w-3 h-3 bg-[#FFD87D] rounded-full opacity-60"></div>
              <div class="absolute bottom-1 right-1 w-2 h-2 bg-[#FFD87D] rounded-full opacity-60"></div>
              <svg class="h-8 w-8 text-black z-10" fill="currentColor" viewBox="0 0 24 24">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
              </svg>
            </div>
          </div>
          <div>
            <h1 class="text-xl font-bold text-gray-800">SafeWay Transport</h1>
          </div> -->
          <img src="logo.png" alt="Logo" class="w-50 h-auto z-20" />
        </div>

        <!-- Desktop Navigation -->
        <div class="ml-10 hidden lg:flex items-center">
          <div class="flex items-center space-x-8">
            <a href="/" class="text-gray-700 hover:text-yellow-500 font-medium transition-colors">
              Home
            </a>
            <a (click)="navigateToAboutUs()"
              class="text-gray-700 hover:text-yellow-500 font-medium transition-colors cursor-pointer">
              About us
            </a>
            <a (click)="navigateToServices()"
              class="text-gray-700 hover:text-yellow-500 font-medium transition-colors cursor-pointer">
              Services
            </a>
            <a (click)="navigateToFleet()"
              class="text-gray-700 hover:text-yellow-500 font-medium transition-colors cursor-pointer">
              Fleet
            </a>
            <a (click)="navigateToContactUs()"
              class="text-gray-700 hover:text-yellow-500 font-medium transition-colors cursor-pointer">
              Contact us
            </a>
          </div>
        </div>

        <!-- Mobile Navigation Button -->
        <div class="lg:hidden">
          <button onclick="toggleMobileMenu()" class="p-2 rounded-md hover:bg-gray-100 transition-colors">
            <svg id="menu-icon" class="h-6 w-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
            <svg id="close-icon" class="h-6 w-6 text-gray-600 hidden" fill="none" stroke="currentColor"
              viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Mobile Menu -->
      <div id="mobile-menu" class="lg:hidden mt-4 pt-4 border-t border-gray-200 hidden">
        <div class="flex flex-col space-y-3">
          <a href="/" onclick="closeMobileMenu()"
            class="text-gray-700 hover:text-yellow-500 font-medium py-2 transition-colors">
            Home
          </a>
          <a href="/about" onclick="closeMobileMenu()"
            class="text-gray-700 hover:text-yellow-500 font-medium py-2 transition-colors">
            About us
          </a>
          <a href="/services" onclick="closeMobileMenu()"
            class="text-gray-700 hover:text-yellow-500 font-medium py-2 transition-colors">
            Services
          </a>
          <a href="/fleet" onclick="closeMobileMenu()"
            class="text-gray-700 hover:text-yellow-500 font-medium py-2 transition-colors">
            Fleet
          </a>
          <a href="/contact" onclick="closeMobileMenu()"
            class="text-gray-700 hover:text-yellow-500 font-medium py-2 transition-colors">
            Contact us
          </a>
        </div>
      </div>
    </div>
  </nav>
</header>

<script>
  function toggleMobileMenu() {
    const mobileMenu = document.getElementById("mobile-menu");
    const menuIcon = document.getElementById("menu-icon");
    const closeIcon = document.getElementById("close-icon");

    mobileMenu.classList.toggle("hidden");
    menuIcon.classList.toggle("hidden");
    closeIcon.classList.toggle("hidden");
  }

  function closeMobileMenu() {
    const mobileMenu = document.getElementById("mobile-menu");
    const menuIcon = document.getElementById("menu-icon");
    const closeIcon = document.getElementById("close-icon");

    mobileMenu.classList.add("hidden");
    menuIcon.classList.remove("hidden");
    closeIcon.classList.add("hidden");
  }
</script>
