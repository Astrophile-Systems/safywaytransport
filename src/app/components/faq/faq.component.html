<section class="py-20 bg-gray-50 dark:bg-gray-800">
  <div class="container mx-auto px-4">
    <div class="text-center mb-16">
      <h2 class="text-4xl font-bold text-gray-800 dark:text-white mb-4">Frequently Asked <span
          class="text-[#f6be55]">Questions</span>
      </h2>
      <p class="text-xl text-gray-600 dark:text-gray-300 max-w-3xl mx-auto">
        Find answers to common questions about our car rental services for Hajj and Umrah pilgrims.
      </p>
    </div>

    <div class="max-w-4xl mx-auto space-y-4">
      <div *ngFor="let faq of faqs; let i = index"
        class="overflow-hidden bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg">
        <div class="p-0">
          <button (click)="toggleFAQ(i)"
            class="w-full p-6 text-left flex justify-between items-center hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
            <h3 class="font-semibold text-gray-800 dark:text-white pr-4">{{ faq.question }}</h3>
            <svg *ngIf="openIndex === i" class="h-5 w-5 text-amber-600 dark:text-amber-400 flex-shrink-0" fill="none"
              stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
            </svg>
            <svg *ngIf="openIndex !== i" class="h-5 w-5 text-amber-600 dark:text-amber-400 flex-shrink-0" fill="none"
              stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </button>
          <div *ngIf="openIndex === i" class="px-6 pb-6">
            <p class="text-gray-600 dark:text-gray-300 leading-relaxed">{{ faq.answer }}</p>
          </div>
        </div>
      </div>
    </div>
